  选股:
  - name: search_stocks
    description: 统一选股工具：根据条件从全市场筛选股票。支持自然语言条件（如 'PE<20 半导体'、'净利增长>15%'）和结构化 filters。source='eastmoney' 使用东财智能选股（130+条件），'local_db'
      查本地数据库，'auto' 自动选择。当用户要求选股、筛选股票时使用此工具。
    category: 选股
    layer: 决策层
    domain:
    - finance
  - name: review_stocks_with_indicator
    description: 用指标策略批量审核股票。对每只股票执行指标代码，检查是否出现买入信号。返回每只股票的 buy/sell 信号状态和价格。
    category: 选股
    layer: 决策层
    domain:
    - finance
  - name: list_user_selection_strategies
    description: 列出用户收藏的选股策略列表。
    category: 选股
    layer: 决策层
    domain:
    - finance
  交易:
  - name: list_strategies
    description: 列出用户的所有交易策略（含运行状态）。返回策略 ID、名称、类型、状态、交易对、时间框架。用于发现可用策略。
    category: 交易
    layer: 执行层
    domain:
    - trading
  - name: get_strategy_detail
    description: 获取策略的详细配置信息（类型、交易对、指标、参数、状态等）。
    category: 交易
    layer: 执行层
    domain:
    - trading
  - name: start_strategy
    description: 启动一个交易策略，开始按指标信号自动执行买卖操作。
    category: 交易
    layer: 执行层
    domain:
    - trading
  - name: stop_strategy
    description: 停止一个正在运行的交易策略。
    category: 交易
    layer: 执行层
    domain:
    - trading
  - name: get_strategy_trades
    description: 获取策略的最近交易记录，包含买卖价格、数量、盈亏等。
    category: 交易
    layer: 执行层
    domain:
    - trading
