categories:
  技术分析:
  - name: analyze_trend
    description: 综合技术趋势分析（MA + MACD + RSI + BOLL + KDJ 五维共振），返回均线排列、趋势评分、买卖信号和所有子指标详情。这是最核心的分析工具，一次调用获取全部技术面数据。
    category: 技术分析
    layer: 分析层
    domain:
    - finance
  - name: calculate_ma
    description: 计算指定周期的移动平均线数值及斜率（趋势方向）。
    category: 技术分析
    layer: 分析层
    domain:
    - finance
  - name: get_volume_analysis
    description: 分析量能变化：量比、成交量趋势、放量/缩量判断、量价关系（量价齐升/缩量上涨/放量下跌等）。
    category: 技术分析
    layer: 分析层
    domain:
    - finance
  - name: analyze_pattern
    description: 识别K线形态（增强版）：锤子线、十字星、吞没、早晨/黄昏之星、三连阳/阴、红三兵/黑三鸦、长上下影线、缺口等 15+ 种形态。
    category: 技术分析
    layer: 分析层
    domain:
    - finance
  - name: get_chip_distribution
    description: 分析筹码分布：获利比例、平均成本、集中度、支撑压力位（仅A股支持）。基于120根日K线衰减成本分布模型计算。
    category: 技术分析
    layer: 分析层
    domain:
    - finance
  - name: get_indicator_snapshot
    description: 一次性获取所有主要技术指标快照（MA/MACD/RSI/BOLL/KDJ/量比），减少多轮工具调用。适合需要快速全面了解技术面的场景。
    category: 技术分析
    layer: 分析层
    domain:
    - finance
  回测:
  - name: run_backtest
    description: ''
    category: 回测
    layer: 决策层
    domain:
    - finance
    - trading
  - name: get_backtest_history
    description: 查询策略的历史回测记录列表（即过去跑过的回测任务结果）。注意：这不是获取K线数据的工具，获取K线请用 agent_get_kline。
    category: 回测
    layer: 决策层
    domain:
    - finance
    - trading
  K线图表:
  - name: render_candlestick
    description: ''
    category: K线图表
    layer: 显示层
    domain:
    - finance
  工作区:
  - name: shell_exec
    description: 在工作区目录中执行 shell 命令（支持流式输出）。命令的 cwd 自动设为当前会话的工作区。可用环境变量 WORKSPACE 获取工作区绝对路径。适用场景：pip install、python、文件操作、数据处理、调用外部工具。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_save_script
    description: 保存 Python 脚本到工作区，支持自动版本管理。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_load_script
    description: 从工作区加载 Python 脚本。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_list
    description: 列出工作区中的所有脚本和文件。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_write_file
    description: 写入文件到工作区。用于创建新文件、保存脚本、写入数据等。修改代码时先用 workspace_read_file 读取，再用此工具写回。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_read_file
    description: 读取工作区中的文件内容。用于查看代码、读取数据、分析文件等。修改代码前先用此工具读取当前内容。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_edit_file
    description: 精确编辑工作区文件：支持精确文本替换和正则表达式替换。比全量重写更安全高效。先用 workspace_read_file 读取内容，找到要修改的部分，再用此工具精确替换。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_code_review
    description: 对工作区中的 Python 代码进行静态审查：语法检查、AST分析、常见问题检测。在执行代码前调用可提前发现错误。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: workspace_exec_script
    description: 在工作区中执行 Python 脚本，支持数据源注入（get_kline/get_ticker 等自动可用）。可加载已保存脚本（传 name）或直接执行代码（传 code）。支持流式输出和最长 600 秒超时。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: run_background
    description: 后台执行脚本，立即返回 task_id。用 poll_task 查询结果。适合长时间任务（大数据处理、全市场扫描等）。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: poll_task
    description: 查询后台任务状态和结果。
    category: 工作区
    layer: 支撑层
    domain:
    - coding
  - name: read_tool_chain
    description: 读取指定场景的工具链配置。用于查看当前场景建议使用哪些工具及顺序。
    category: 工作区
    layer: 支撑层
    domain: []
  - name: write_tool_chain
    description: 保存工具链配置。执行任务成功后，将验证过的工具调用顺序写回配置，供下次使用。
    category: 工作区
    layer: 支撑层
    domain: []
  - name: list_tool_chains
    description: 列出所有已配置的工具链。用于查看系统支持哪些场景。
    category: 工作区
    layer: 支撑层
    domain: []
  定时任务:
  - name: create_cron_job
    description: ''
    category: 定时任务
    layer: 支撑层
    domain: []
  - name: list_cron_jobs
    description: 列出所有定时任务及其运行状态。用于查看已有任务、检查执行结果。
    category: 定时任务
    layer: 支撑层
    domain: []
  - name: update_cron_job
    description: 更新定时任务：暂停/恢复/修改 cron 表达式/修改 prompt。只传需要改的字段。
    category: 定时任务
    layer: 支撑层
    domain: []
  - name: delete_cron_job
    description: 删除定时任务。不可恢复。
    category: 定时任务
    layer: 支撑层
    domain: []
  名称查询:
  - name: search_stock_by_name
    description: 根据中文名称或关键词搜索股票代码。支持模糊匹配，如输入茅台可找到贵州茅台(600519)。当用户提供中文股票名称但没有代码时，必须先用此工具查到代码再进行后续分析。
    category: 名称查询
    layer: 数据层
    domain: []
  - name: get_stock_sector_info
    description: '[短线+中线] 个股所属行业和概念（从本地 stock_basic_info 表查询）。快速获取一只股票属于哪些行业和概念板块，用于题材关联判断。'
    category: 名称查询
    layer: 数据层
    domain: []
