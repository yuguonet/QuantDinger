    description: ''
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_realtime_quote
    description: 获取股票或交易对的实时行情（最新价、涨跌幅、成交量、换手率、量比、PE/PB等）。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: agent_get_kline
    description: 获取股票/交易对的K线数据（OHLCV：开盘价/最高价/最低价/收盘价/成交量）。支持多周期：1m/5m/15m/30m/1H/4H/1D/1W。这是获取原始K线数据的核心工具，用于趋势分析和技术指标计算。当用户要求查看K线、行情数据、历史价格时必须使用此工具。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_stock_info
    description: 获取股票基本面信息（行业、概念、市值、PE、PB等）。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_dragon_tiger
    description: 获取龙虎榜数据。stock_code为空返回全市场龙虎榜，非空返回该股票的历史龙虎榜。包含上榜股票代码、名称、买卖金额、净买入额、涨跌幅、上榜原因。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_hot_rank
    description: 获取实时股票热榜/人气榜：排名、代码、名称、人气分数、价格、涨跌幅。反映市场关注度最高的个股。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_limit_pool
    description: '获取涨跌停/炸板股票池。pool_type: zt=涨停池（可筛连板）、dt=跌停池、broken=炸板池（曾封涨停被打开，资金分歧信号）。一次调用可同时获取三类数据。'
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_market_overview
    description: 获取全市场涨跌统计快照：上涨/下跌家数、情绪指标。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_fund_flow
    description: 获取个股资金流向：主力/大单/中单/小单的净流入额。支持单只（传一个代码）或批量（逗号分隔，最多20只）。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_sector_fund_flow
    description: 获取行业板块资金流向排名。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_concept_fund_flow
    description: 获取概念板块资金流向排名。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_fund_flow_120d
    description: '[中线] 个股资金流120日日级数据。主力/大单/中单/小单净流入。近20日主力累计净流入=资金在建仓，持续净流出=资金在撤退。配合筹码分析。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_fund_flow_minute
    description: '[短线] 个股资金流分钟级实时数据。当日盘中主力/大单/超大单实时净流入。盘中盯资金用：超大单突然大幅流入=可能有消息或主力进场。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_market_indices
    description: 获取大盘指数实时行情（上证指数、深证成指、创业板指）。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_sector_rankings
    description: 获取行业板块涨跌排名和资金流向。
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_order_book
    description: '[短线] 五档盘口。买一~买五/卖一~卖五价格+挂单量+实时行情。短线盘口语言：买盘挂单大=支撑强，卖盘挂单大=压力大。大单托底可能是诱多，大单压顶可能是洗盘。'
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_index_etf_quote
    description: '[短线+中线] 指数/ETF行情（扩展 get_market_indices：现有工具仅覆盖3大指数，本工具支持任意指数+ETF代码，如510050/510300/159919等）。上证/深证/沪深300/创业板指+主流ETF实时行情。看大盘方向用：指数涨跌判断市场情绪，ETF跟踪行业/宽基趋势。短线看情绪，中线看趋势。'
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: batch_valuation_compare
    description: '[中线] 批量估值对比。多只股票PE/PB/市值/涨跌幅横向排列。同行业选股用：PE最低+PB最低=潜在低估标的。最多20只同时对比。'
    category: 行情数据
    layer: 数据层
    domain:
    - finance
  - name: get_hot_sectors
    description: '[短线核心] 实时热门板块（行业+概念）。包含涨停家数、领涨股、成交额、强度标签（强势领涨/稳步上行/弱势调整）、市场情绪判断。比 get_sector_rankings 更详细，短线看板块主线必用。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_sector_trend_analysis
    description: '[短线+中线] 板块趋势分析（1个月趋势+6个月周期+今日预测）。看哪些板块持续走强/走弱、季节性规律、今日可能的热门板块。中线行业轮动核心工具。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_sector_history_data
    description: '[中线] 板块历史排名走势（最近N天每日排名数据）。用于绘制板块排名走势图、分析板块轮动节奏。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_sector_prediction
    description: '[中线] 今日热门板块预测（基于趋势+季节性+最新排名综合评分）。中线布局参考。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_sector_cycle
    description: '[中线] 板块6个月周期分析（季节性规律、轮动模式）。判断当前月份历史表现最佳的板块。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_sector_stocks
    description: '[短线+中线] 板块内强势个股（指定板块代码，返回板块内领涨股详情）。用于板块确认后找龙头和补涨标的。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_hot_stocks_with_reason
    description: '[短线核心] 当日强势股+题材归因。同花顺编辑部人工标注的reason tags（如「算力租赁+Token工厂」）。短线打板/跟题材必用：先看哪些题材在发酵，再找龙头。含涨幅、换手、大单净量。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_northbound_flow
    description: '[短线+中线] 北向资金实时流向。沪股通/深股通分钟级净买入（262个时间点）。外资是A股边际定价力量：北向大幅流入=市场偏强，持续流出=谨慎。盘中看实时，收盘看累计。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_stock_concept_blocks
    description: '[短线+中线] 个股概念板块归属。一次拿全所属板块（行业/概念/地域）+板块涨跌幅+龙头股。短线看题材联动（板块涨=个股跟涨概率大），中线看行业赛道。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_lockup_expiry
    description: '[中线] 限售解禁日历。历史解禁+未来90天待解禁。中线持仓必查风险项：大比例解禁前1-2周通常有抛压，首发原股东解禁尤其注意。解禁比例>5%需警惕。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_industry_ranking
    description: '[短线+中线] 行业板块涨跌排名（补充 get_sector_rankings：本工具直连东财push2，返回约100个行业的涨跌幅+上涨下跌家数+领涨股，数据更全）。约100个行业的涨跌幅+上涨下跌家数+领涨股。短线看当日资金主线（哪个行业在涨），中线看行业轮动趋势（连续走强的行业）。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
  - name: get_dragon_tiger_detail
    description: '[短线核心] 龙虎榜席位详情（补充 get_dragon_tiger：现有工具返回基础数据，本工具返回买卖席位TOP5+机构专用席位动向）。上榜记录+买卖席位TOP5营业部+机构专用席位动向。短线追踪游资必用：知名游资席位买入=短期有溢价预期，机构专用净买入=中线信号。'
    category: 行情数据
    layer: 分析层
    domain:
    - finance
