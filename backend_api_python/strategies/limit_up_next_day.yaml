# 涨停板次日博弈策略（超短 T+1）
# 数据验证：limit_up_count>=20 + autocorr>0.1 + amplitude>0.03 + limit_down_count<=10 的 126 只股票
# 涨停中位数 29 次，振幅中位数 3.73%，自相关 0.119

name: limit_up_next_day
display_name: 涨停板次日博弈
description: |
  涨停股次日低开后翻红博弈。
  数据验证：limit_up_count>=20 + autocorr>0.1 + amplitude>0.03 + limit_down_count<=10 的 126 只股票，
  涨停中位数 29 次，振幅中位数 3.73%，自相关 0.119。
  适合 T+1 博弈，高风险高收益。

category: momentum
core_rules: [1, 2, 5]
required_tools:
  - get_daily_history
  - get_realtime_quote

default_active: true
default_priority: 30

# ── 优化参数（基于数据验证的最佳参数组合）──
params:
  min_open_gap: 1.0            # 最低低开幅度 %（0.5-2.0）
  max_open_gap: 3.0            # 最高低开幅度 %（2.0-5.0，过大说明趋势破了）
  turn_positive_pct: 0.5       # 翻红涨幅 %（0-2%）
  use_vol_confirm: true        # 是否叠加量能确认
  vol_ma_period: 20            # 成交量均线周期
  vol_ratio: 1.2               # 放量倍数（0.8-2.0）
  position_pct: 50             # 仓位比例 %（半仓博弈）
  stop_loss_pct: 4.0           # 止损比例 %
  take_profit_pct: 8.0         # 止盈比例 %

instructions: |
  **涨停板次日博弈（Limit-Up Next Day）**

  核心逻辑：涨停股次日低开后翻红 = 主力洗盘确认，博弈第二波拉升。

  ## 选股预筛（stock_stats.csv 条件）
  - limit_up_count >= 20（近一年涨停 20 次以上，有涨停基因）
  - autocorr > 0.1（动量惯性，涨了容易继续涨）
  - amplitude > 0.03（日内振幅 > 3%，有博弈空间）
  - limit_down_count <= 10（跌停次数不过多，排除极端股）
  - 满足条件的股票约 126 只，涨停中位数 29 次，振幅中位数 3.73%

  ## 信号判定

  ### 买入条件（全部满足）
  1. **前日涨停**：前一个交易日涨停（收盘价 = 涨停价）
     - 使用 `get_daily_history` 获取前日 K 线
     - 判断是否涨停（涨幅 >= 9.9%）
  2. **当日低开**：开盘价低于前日收盘价 1.0%-3.0%
     - 使用 `get_realtime_quote` → open_price
     - open_gap = (开盘价 / 前收 - 1) × 100
     - 低开 1-3% 是正常洗盘，低开过多（> 5%）可能是趋势破了
  3. **当日翻红**：当前涨幅 >= 0.5%
     - 使用 `get_realtime_quote` → change_pct
     - 从低开到翻红，说明主力在护盘
  4. **量能确认**（可选）：当日成交量 > 20 日均量 × 1.2
     - 放量翻红更可靠

  ### 卖出条件
  1. 止损：-4.0%
  2. 止盈：+8.0%
  3. T+1 规则：买入当日不可卖出

  ## 评分调整
  - 涨停次日低开翻红：sentiment_score +10
  - 在 buy_reason 中注明"涨停板次日博弈"

  ## 风险提示
  - ⚠️ 高风险策略，半仓操作
  - 涨停板次日波动极大，需严格止损
  - 适合有经验的短线交易者

  ## A 股规则
  - T+1：买入当日不可卖出
  - 涨跌停：±10%（创业板/科创板 ±20%）
  - 最小交易单位：100 股
