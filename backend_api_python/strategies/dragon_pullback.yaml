# 龙回头策略（超短 2-5 天）
# 数据验证：limit_up_count>=30 的龙头股共 1082 只
# 年化中位数 25.6%（全市场 12.3%），Sharpe 0.48，100% 盈利
# ⚠️ 回撤中位数 -68.1%，需严格止损

name: dragon_pullback
display_name: 龙回头
description: |
  龙头股大涨后回调到支撑位，缩量企稳后二次启动。
  数据验证：limit_up_count>=30 的 1082 只龙头股，
  年化中位数 25.6%（全市场 12.3%），Sharpe 0.48。100% 盈利。
  ⚠️ 回撤中位数 -68%，需严格止损。适合超短（2-5 天）。

category: momentum
core_rules: [1, 2, 3, 5]
required_tools:
  - get_daily_history
  - get_realtime_quote
  - analyze_trend

default_active: true
default_priority: 50

# ── 优化参数（基于数据验证的最佳参数组合）──
params:
  lookback_period: 20          # 前期涨幅观察窗口（10-40）
  pullback_min_pct: 10.0       # 最小回调幅度 %（8-15）
  pullback_max_pct: 25.0       # 最大回调幅度 %（20-35）
  vol_ma_period: 20            # 成交量均线周期
  vol_shrink_ratio: 0.5        # 缩量比例（0.3-0.7）
  rsi_period: 14               # RSI 周期
  rsi_bounce: 35               # RSI 从超卖区回升阈值（25-45）
  use_ma_support: true         # 是否叠加均线支撑确认
  ma_support_period: 20        # 支撑均线周期（10-30）
  ma_near_pct: 2.0             # 价格距均线距离 %（1-4%）
  position_pct: 70             # 仓位比例 %
  stop_loss_pct: 5.0           # 止损比例 %
  take_profit_pct: 12.0        # 止盈比例 %
  trailing_pct: 5.0            # 移动止损 %

instructions: |
  **龙回头（Dragon Pullback）**

  核心逻辑：龙头股大涨后回调到支撑位 + 缩量企稳 + RSI 从超卖回升 = 二次启动信号。

  ## 选股预筛（stock_stats.csv 条件）
  - limit_up_count >= 30（近一年涨停 30 次以上，龙头基因）
  - 满足条件的股票约 1082 只，年化中位数 25.6%，Sharpe 0.48，100% 盈利
  - ⚠️ 回撤中位数 -68.1%，必须严格止损！

  ## 信号判定

  ### 买入条件（全部满足）
  1. **前期大涨**：近 20 日内有显著涨幅
     - 使用 `get_daily_history` 计算近 20 日最高价
     - 识别出前期龙头特征
  2. **回调到位**：从近期高点回调 10%-25%
     - 回调 < 10%：没回调够，追高风险大
     - 回调 > 25%：趋势可能破了
     - 使用 `analyze_trend` 获取近期高点和当前价位
  3. **缩量回调**：当日成交量 < 20 日均量 × 0.5
     - 使用 `get_realtime_quote` → volume_ratio
     - 缩量说明主力没走，是洗盘不是出货
  4. **RSI 从超卖回升**：RSI(14) 从下方上穿 35
     - 使用 `get_daily_history` 计算 RSI
     - RSI 回升 = 卖压衰竭，买盘介入
  5. **均线支撑**（可选）：价格在 20 日 EMA 附近（±2%）
     - 均线支撑 + 缩量回调 = 高确定性买点

  ### 卖出条件
  1. 止损：-5.0%（严格执行！）
  2. 止盈：+12.0%
  3. 移动止损：从最高点回撤 5.0%
  4. RSI > 70（超买离场）

  ## 评分调整
  - 龙头回调企稳：sentiment_score +10
  - 缩量回调 + RSI 回升：sentiment_score +8
  - 在 buy_reason 中注明"龙回头信号"

  ## 风险提示
  - ⚠️ 回撤中位数 -68%，必须严格止损
  - 龙头股波动极大，适合有经验的短线交易者
  - 不抄底！等缩量企稳信号确认后再介入

  ## A 股规则
  - T+1：买入当日不可卖出
  - 涨跌停：±10%（创业板/科创板 ±20%）
  - 最小交易单位：100 股
