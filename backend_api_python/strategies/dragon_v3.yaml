# 连板猎手 v3.1（超短 2-10 天）
# 数据验证：22977 个连板段，2504 笔交易，82.4% 胜率，+9.25% 均收益
# Walk-Forward：30/30 月全正收益，IS→OOS 衰减仅 1.27%
# ⚠️ 需要全市场扫描，不适合逐股使用

name: dragon_v3
display_name: 连板猎手v3.1
description: |
  连板猎手 v3.1 — 基于 22977 个连板段的横向/纵向/共振分析优化。
  
  核心逻辑：≥2板涨停 + 高开过滤 + 封板强度确认 → 追踪止损/止盈/峰值信号出场。
  双分支设计：沪深主板(10%) / 创科板(20%) 独立参数。
  
  数据验证：
  - 2,504 笔交易，82.4% 胜率，+9.25% 平均收益
  - 累计收益 +23,169%，30/30 月全正收益
  - Walk-Forward IS→OOS 衰减仅 1.27%
  
  ⚠️ 这是横截面策略，需全市场扫描连板股，不适合逐股使用。
  ⚠️ 创科 5 板+ 是陷阱（20% 胜率，-43% 回撤），已过滤。

category: momentum
core_rules: [1, 2, 3, 5]
required_tools:
  - get_daily_history
  - get_realtime_quote

default_active: true
default_priority: 90

# ── 最优参数（基于 22977 连板段分析）──
params:
  # ── 买入参数 ──
  min_streak: 2                # 最小连板数（2=只做2板+，1板胜率仅55%）
  limit_threshold: 9.5         # 涨停阈值%（主板9.5/创科19.0）
  max_gap_pct: 8.0             # 最大高开幅度%（>8%追高风险大）
  max_seal_pct: 0.5            # 封板强度上限%（close距high，越小封得越紧）
  max_rsi: 90.0                # RSI上限（排除极端超买）
  
  # ── 卖出参数 ──
  trailing_stop_pct: 5.0       # 追踪止损%（从最高点回撤）
  take_profit_pct: 15.0        # 止盈%
  peak_rsi_threshold: 80.0     # 峰值RSI阈值（触发出场）
  peak_upper_shadow: 40.0      # 峰值上影线%阈值（触发出场）
  
  # ── 仓位 ──
  position_pct: 100            # 仓位比例%

instructions: |
  **连板猎手 v3.1（Dragon Hunter V3）**

  核心逻辑：全市场扫描涨停连板股 → 横向过滤入场 → 峰值信号出场。

  ## 策略架构

  ```
  双分支: 沪深主板(10%) / 创科板(20%)
  买: ≥2板涨停 + 高开<阈值 + 封板强度≤0.5%
  卖: 追踪止损 / 止盈 / 峰值信号(RSI+上影线)
  ```

  ## 选股预筛（连板扫描条件）
  - 全市场扫描所有涨停连板段
  - 连板 ≥ 2 天（1 板胜率仅 55%，不够）
  - 允许中间夹 1-2 天洗盘（max_gap=2）
  - 满足条件的连板段约 25,545 段（2024-2026）

  ## 信号判定

  ### 买入条件（全部满足）
  1. **连板 ≥ 2 天**：连续涨停 2 天以上
     - 1 板胜率 55%，2 板 73%，3 板 92%，4 板 100%
     - 连板数是最强筛选维度
  2. **高开幅度 < 8%**：当日开盘 vs 前日收盘
     - 平开胜率 65%，超大高开仅 47%
     - 主板 < 8%，创科 < 12%
  3. **封板强度 ≤ 0.5%**：close 接近 high
     - 值越小封得越紧，说明涨停封死
  4. **RSI < 90**：排除极端超买
  5. **非创科 5 板+**：创科 5 板+ 20% 胜率，-43% 回撤

  ### 卖出条件（任一满足）
  1. **追踪止损**：从最高点回撤 5%
  2. **止盈**：+15%
  3. **峰值信号**：RSI ≥ 80 且上影线 ≥ 40%
     - 峰值后 D+1：79% 概率跌 3.3%，必须当天出
  4. **KDJ 死叉** + RSI > 70
  5. **开板回调**：非涨停日且跌幅 > 3%

  ## 按板块分支

  | 条件 | 沪深主板 | 创科板 |
  |------|----------|--------|
  | 涨停阈值 | 9.5% | 19.0% |
  | 最小连板 | 2 | 2 |
  | 最大连板 | 无上限 | 4（5板+过滤） |
  | 最大高开 | 8% | 12% |

  ## 回测结果

  | 分支 | 交易数 | 胜率 | 平均收益 | 最大回撤 |
  |------|--------|------|----------|----------|
  | 主板 | 2,249 | 81.8% | +8.35% | — |
  | 创科 | 255 | 88.2% | +17.25% | — |
  | 合计 | 2,504 | 82.4% | +9.25% | -49.3%(累计) |

  | 连板数 | 交易数 | 胜率 | 平均收益 |
  |--------|--------|------|----------|
  | 2板 | 1,535 | 80.5% | +6.16% |
  | 3板 | 450 | 84.2% | +13.52% |
  | 4板 | 232 | 87.5% | +14.65% |
  | 5板+ | 287 | 85%+ | +14~23% |

  月度：30/30 月全正收益 ✅

  ## 关键发现
  1. 连板数是最强筛选维度
  2. 高开幅度是第二维度
  3. 龙头 vs 跟风：龙头 +32.7% vs 跟风 +4.4%
  4. 创科 5 板+ 是陷阱，必须过滤
  5. 峰值后 D+1 必须当天出
  6. 封板强度必须接近 0

  ## 使用方式
  ```bash
  # 全市场连板扫描
  python optimizer/dragon/export_dragon_runs.py --start 2024-01-01 --end 2026-12-31

  # 形态分析
  python optimizer/dragon/analyze_dragon_patterns.py --csv optimizer/dragon/analysis_output/dragon_ohlcv.csv

  # 独立回测
  python optimizer/dragon/strategy_dragon_v3.py --csv optimizer/dragon/analysis_output/dragon_ohlcv.csv
  ```

  ## 风险提示
  - ⚠️ 这是横截面策略，需全市场扫描，不适合逐股优化
  - ⚠️ 创科 5 板+ 必须过滤，否则 -43% 回撤
  - ⚠️ 峰值后必须当天出，D+1 79% 概率跌
  - 累计回撤 -49.3%（全仓复利），实盘需控制仓位

  ## A 股规则
  - T+1：买入当日不可卖出
  - 涨跌停：±10%（创业板/科创板 ±20%）
  - 最小交易单位：100 股
