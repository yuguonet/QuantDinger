# 趋势回踩买入策略（短中线 3-10 天）
# 数据验证：trend_score>0.85 + sharpe>1.0 的 34 只股票
# 年化中位数 71.2%，100% 胜率，Sharpe 1.34（数据支撑最强）

name: trend_pullback_buy
display_name: 趋势回踩买入
description: |
  上升趋势中回踩均线支撑位买入。
  数据验证：trend_score>0.85 + sharpe>1.0 的 34 只股票，
  年化中位数 71.2%，100% 胜率，Sharpe 1.34。数据支撑最强。
  适合短中线（3-10 天）。

category: trend
core_rules: [1, 2, 3]
required_tools:
  - get_daily_history
  - get_realtime_quote
  - analyze_trend

default_active: true
default_priority: 20

# ── 优化参数（基于数据验证的最佳参数组合）──
params:
  trend_ema_period: 30         # 趋势 EMA 周期（15-60，取中值）
  pullback_pct: 2.0            # 回踩偏离度 %（1-5%，验证值 2%）
  rsi_period: 14               # RSI 周期（7-21）
  rsi_low: 40                  # RSI 下限（35-50，趋势中回调区）
  rsi_high: 60                 # RSI 上限（50-65，非超买区）
  use_vol_shrink: true         # 是否要求缩量回调
  vol_ma_period: 20            # 成交量均线周期
  vol_shrink_ratio: 0.6        # 缩量比例（0.3-0.8）
  stop_loss_pct: 4.0           # 止损比例 %
  trailing_pct: 4.0            # 移动止损 %

instructions: |
  **趋势回踩买入（Trend Pullback Buy）**

  核心逻辑：EMA 确认上升趋势 + 价格回踩到均线附近 + RSI 在合理区间 = 趋势中的买点。

  ## 选股预筛（stock_stats.csv 条件）
  - trend_score > 0.85（趋势得分 p98，约 34 只）
  - sharpe > 1.0（风险调整收益优秀）
  - ⚠️ 实际使用建议：先用 trend_score > 0.70 粗筛（约 300 只），再由实时信号精筛
  - 满足条件的股票年化中位数 71.2%，100% 胜率，Sharpe 1.34

  ## 信号判定

  ### 买入条件（全部满足）
  1. **趋势确认**：价格在 30 日 EMA 上方
     - 使用 `analyze_trend` 确认 EMA 多头排列
  2. **回踩到位**：价格距离 30 日 EMA 在 2.0% 以内
     - 收盘价 / EMA(30) - 1 ∈ [-2.0%, +2.0%]
  3. **RSI 区间**：RSI(14) 在 40-60 之间
     - 不是超买区（> 60 需警惕）
     - 不是超卖区（< 40 趋势可能破了）
     - 是趋势中的正常回调
  4. **缩量回调**（可选）：当日成交量 < 20 日均量 × 0.6
     - 缩量说明主力没走，是洗盘不是出货

  ### 卖出条件
  1. 止损：-4.0%
  2. 移动止损：从最高点回撤 4.0%
  3. RSI > 70（超买离场）

  ## 评分调整
  - EMA 趋势向上 + RSI 回调：sentiment_score +8
  - 在 buy_reason 中注明"趋势回踩买入"

  ## 设计思路
  - 不追趋势，在趋势确认后等回调买入
  - 适合主升浪中的波段操作
  - ⚠️ 需确认不是假突破后的回调

  ## A 股规则
  - T+1：买入当日不可卖出
  - 涨跌停：±10%（创业板/科创板 ±20%）
  - 最小交易单位：100 股
