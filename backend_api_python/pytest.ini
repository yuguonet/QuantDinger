[pytest]
# 注册 markers（根因：本仓此前无任何 pytest 配置文件，markers 未注册 ⇒
# `-m "not slow"` 之类过滤不可用，只能整跑）。2026-10-18 F18。
markers =
    slow: 完整 qd_smoke 套件（40 用例分钟级、共享进程内状态必须串行）。日常全量：pytest tests/ -m "not slow"；只跑冒烟：pytest tests/ -m slow
    integration: 需要外部依赖（PG/网络/第三方 CLI）的用例，环境缺件时或 skip 或 exit 2
# 收集范围钉死 tests/（2026-10-18 F22 落地时补，根因修非兜底）：无 testpaths 时
# 裸 pytest 从 rootdir 递归，会把 del/ 归档（import 已退役的 app.agentcore）也拖进
# 收集 ⇒ 4 个 collection error 直接 Interrupted，误判"全崩"。显式传路径时本项
# 不生效（pytest tests/ -m slow 等既有用法不受影响）。
testpaths = tests
