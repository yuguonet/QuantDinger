# ============================================================
# Agent Template - 基础配置
# ============================================================

app_name: "Agent Template"
version: "1.0.0"
log_level: "INFO"
prompts_dir: "prompts"

# ---------- LLM 配置 ----------
# 默认走 QuantDinger LLMService（读取 backend_api_python/.env）
# qd_provider: openrouter / openai / google / deepseek / grok
#   留空则自动检测（优先级: DeepSeek > Grok > OpenAI > Google > OpenRouter）
# 如果指定 api_key + provider=DashScope/OpenAI，则走原始实现
llm:
  provider: ""                   # 原始 provider: dashscope / openai（留空走 QD LLMService）
  qd_provider: ""               # QD provider: openrouter / openai / google / deepseek / grok（留空自动检测）
  model: ""                     # 留空则使用 AGENT_LLM_MODEL 或 provider 默认模型
  api_key: ""                   # QD 模式下由 .env 管理，无需填写
  base_url: null
  temperature: 0.7
  max_tokens: 2048
  top_p: 0.9
  timeout: 60

# ---------- RAG 配置 ----------
rag:
  enabled: false
  embedding_provider: "dashscope"
  embedding_model: "text-embedding-v3"
  embedding_api_key: ""
  embedding_dimension: 1024
  qdrant_host: "localhost"
  qdrant_port: 6333
  qdrant_grpc_port: 6334
  qdrant_use_grpc: true
  collection_name: "agent_docs"
  top_k: 5
  score_threshold: 0.5

# ---------- Memory 配置 ----------
memory:
  backend: "local"               # local / redis
  max_history: 20
  redis_url: "redis://localhost:6379/0"
  redis_prefix: "agent:memory:"
  ttl_seconds: 86400

# ---------- Server 配置 ----------
server:
  host: "0.0.0.0"
  port: 8000
  debug: false
  cors_origins:
    - "*"
