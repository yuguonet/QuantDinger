  description: BB超卖全市场扫描+深入分析。先用布林带下轨突破策略筛选全市场股票，再对候选股票逐只做技术面深入分析，给出综合评分。适用于：今日BB超卖信号扫描、BB选股、布林带下轨选股。
  priority: 10
