- name: short_term_screener
  description: 盘中短线选股专家。先用Python全市场预筛选（涨停池连板+热门板块龙头+强势股题材归因），再对候选股逐只做技术面+资金流深入分析。适用于：今天买什么、短线机会、涨停股里哪些能追、找短线标的。
  priority: 9
  tools:
  - get_indicator_snapshot
  - get_fund_flow_realtime
  - get_market_indices
  - get_limit_pool
  - get_hot_sectors
  - get_hot_stocks_with_reason
  - agent_technical_analysis
  - get_realtime_quote
  - agent_get_kline
  - search_stock_by_name
- name: post_market_screener
  description: 盘后短线选股专家。收盘后用全天K线做技术形态筛选（平台突破/底部放量启动/均线支撑回踩/MACD金叉/缩量回调放量突破/突破前高），找次日介入点，计算入场/止损/目标位。适用于：收盘后明天买什么、盘后复盘选股、短线技术选股。
  priority: 7
  tools:
  - search_stocks
  - get_indicator_snapshot
  - get_fund_flow_realtime
  - agent_technical_analysis
  - get_realtime_quote
  - agent_get_kline
  - search_stock_by_name
- name: eod_screener
  description: 尾盘选股专家。用条件选股(search_stocks)做初筛，再用Python验证尾盘特征（收盘接近最高价+放量+主线题材），最后对候选股做技术面+资金流深入分析。适用于：14:30后尾盘买什么、隔夜持仓标的、次日计划。
  priority: 8
  tools:
  - search_stocks
  - get_indicator_snapshot
  - get_fund_flow_realtime
  - get_limit_pool
  - get_hot_sectors
  - get_hot_stocks_with_reason
  - agent_technical_analysis
