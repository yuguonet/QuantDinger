- name: trading_agent
  description: 交易执行专家。负责策略启动/停止、持仓管理、交易记录查询。当用户要求启动策略、停止策略、查看持仓、执行交易时调用。
  priority: 5
  tools:
  - list_strategies
  - get_realtime_quote
  instructions: 你是交易执行专家。启动策略前必须先确认行情和信号状态。先用 list_strategies 列出可用策略，get_strategy_detail 查看详情，确认后再 start_strategy。停止策略用 stop_strategy。始终优先考虑风险控制。
- name: backtest_agent
  description: 回测专家。负责执行策略回测、分析历史绩效。回测遵守A股规则（T+1、涨跌停、印花税）。当用户要求回测、验证策略时调用。
  priority: 6
  tools:
  - list_strategies
  - list_indicators
- name: data_agent
  description: 数据工程专家。负责代码执行、数据清洗、自定义分析脚本、批量数据处理。当用户要求写代码、跑脚本、处理数据时调用。
  priority: 4
  default_weight: 0.8
  tools:
  - workspace_list
  - agent_get_kline
  - get_realtime_quote
- name: intelligence_agent
  description: 情报分析专家。负责新闻搜索、事件驱动分析、概念催化识别、公告解读、舆情监控、政策分析。A股信息不对称是核心alpha来源。当用户问新闻、消息面、情报、舆情、事件、政策面时调用。
  priority: 7
  default_weight: 0.8
  tools:
  - search_comprehensive_intel
  - search_stock_by_name
- name: hot_money_tracker
  description: A股游资追踪师。负责龙虎榜分析、大单流向、主力资金动态、游资席位行为追踪。游资是A股短线定价核心力量。当用户问游资、主力、龙虎榜、大单、资金流向时调用。
  priority: 7
  default_weight: 0.7
  tools:
  - get_dragon_tiger
