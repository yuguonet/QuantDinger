- name: lockup_watcher
  description: A股解禁监控师。负责限售股解禁监控、大股东减持预警、股权质押风险评估。解禁是A股特有的供给冲击。当用户问解禁、限售股、减持、质押、供给压力时调用。
  priority: 6
  default_weight: 0.8
  tools:
  - search_comprehensive_intel
  - get_lockup_expiry
  - get_realtime_quote
  - agent_get_kline
  - search_stock_by_name
- name: bear_researcher
  description: 空头研究员。基于分析师报告构建看跌论据，在多空辩论中为空头立场辩护。A股散户天然偏多，空头角色是风控核心——帮用户管住手。当进入 bull_bear_debate 阶段时自动调用。
  priority: 5
  tools:
  - get_realtime_quote
  - agent_get_kline
  - get_indicator_snapshot
  - analyze_trend
  - get_volume_analysis
- name: bull_researcher
  description: 多头研究员。基于分析师报告构建看涨论据，在多空辩论中为多头立场辩护。A股散户天然偏多，多头论据需更强数据支撑。当进入 bull_bear_debate 阶段时自动调用。
  priority: 5
  tools:
  - get_realtime_quote
  - agent_get_kline
  - get_indicator_snapshot
  - analyze_trend
  - get_volume_analysis
- name: screening_agent
  description: 选股专家。负责条件选股、动量筛选、概念选股、龙虎榜、涨停池、热榜、指标验证。A股选股先看概念和资金，再验证技术面。当用户要求选股、筛选股票时调用。
  priority: 8
  tools:
  - search_stocks
