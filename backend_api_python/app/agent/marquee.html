<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>跑马灯演示</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    padding: 24px;
  }
  h1 { font-size: 22px; color: #e94560; letter-spacing: 2px; }
  .marquee {
    width: min(800px, 90vw);
    overflow: hidden;
    white-space: nowrap;
    border: 2px solid #e94560;
    border-radius: 10px;
    background: #16213e;
    padding: 14px 0;
    position: relative;
  }
  .marquee:hover .track { animation-play-state: paused; }
  .track {
    display: inline-block;
    animation: scroll-left 12s linear infinite;
  }
  .marquee.reverse .track { animation-name: scroll-right; }
  .track span { font-size: 18px; letter-spacing: 1px; padding: 0 24px; }
  .track .hl { color: #ffd369; font-weight: bold; }
  @keyframes scroll-left {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @keyframes scroll-right {
    from { transform: translateX(-50%); }
    to   { transform: translateX(0); }
  }
  .glow {
    width: min(800px, 90vw);
    border: 2px solid #0f3460;
    border-radius: 10px;
    background: #16213e;
    padding: 14px 0;
    overflow: hidden;
    white-space: nowrap;
  }
  .glow .glow-track {
    display: inline-block;
    animation: scroll-left 18s linear infinite;
  }
  .glow span {
    font-size: 18px;
    padding: 0 20px;
    color: #53d8fb;
    text-shadow: 0 0 8px rgba(83, 216, 251, 0.6);
  }
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    background: #e94560;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 8px 18px;
    font-size: 14px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  button:hover { opacity: 0.85; }
  label { font-size: 14px; color: #aaa; }
  input[type="range"] { vertical-align: middle; width: 160px; }
  .speed-value { color: #ffd369; min-width: 48px; display: inline-block; }
  .tip { font-size: 12px; color: #666; }
</style>
</head>
<body>
  <h1>跑马灯演示</h1>
  <div class="marquee" id="marquee1">
    <div class="track" id="track1">
      <span>示例文本 ①</span>
      <span class="hl">示例文本 ②</span>
      <span>AAAA +1.0%</span>
      <span>示例公告：这是一条虚构的占位内容，仅用于演示滚动效果</span>
      <span class="hl">BB -0.5%</span>
      <span>示例文本 ③</span>
    </div>
  </div>
  <div class="glow">
    <div class="glow-track">
      <span>✦ 发 光 字 样 ①</span>
      <span>✦ 发 光 字 样 ②</span>
      <span>✦ 示 例 占 位 内 容</span>
      <span>✦ 悬 停 可 暂 停 上 方 跑 马 灯</span>
    </div>
  </div>
  <div class="controls">
    <button id="btn-dir">切换方向</button>
    <button id="btn-pause">暂停</button>
    <label>
      速度
      <input type="range" id="speed" min="2" max="30" value="12" step="1">
      <span class="speed-value" id="speed-value">12s</span>
    </label>
  </div>
  <p class="tip">说明：内容为虚构占位文本；鼠标悬停第一个跑马灯可暂停滚动。</p>
<script>
  const marquee = document.getElementById('marquee1');
  const track = document.getElementById('track1');
  const speedInput = document.getElementById('speed');
  const speedValue = document.getElementById('speed-value');
  const btnPause = document.getElementById('btn-pause');
  const btnDir = document.getElementById('btn-dir');

  track.innerHTML += track.innerHTML;

  speedInput.addEventListener('input', () => {
    track.style.setProperty('--duration', speedInput.value + 's');
    speedValue.textContent = speedInput.value + 's';
  });

  btnPause.addEventListener('click', () => {
    const paused = getComputedStyle(track).animationPlayState === 'paused';
    track.style.animationPlayState = paused ? 'running' : 'paused';
    btnPause.textContent = paused ? '暂停' : '继续';
  });

  btnDir.addEventListener('click', () => {
    marquee.classList.toggle('reverse');
  });
</script>
</body>
</html>
