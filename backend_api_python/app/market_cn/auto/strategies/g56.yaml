# ================================================================
# G56 五重共振 (D-1 盘后判定 → D0 开盘买入) — IDE 门表单文件 (M4)
# 与 strategies/g56.py (G56Strategy.backtest_stock) 逐笔等价 (见 tmp/_g56_equivalence.py)
# ----------------------------------------------------------------
# 五重共振 = G1 池成员(①趋势②波动③基因) + ④金叉预测(rhist_chg>板块Q5)
#           + ⑤板块状态(横截面 regime 门: 主板 rmed>0.25 & %b<=49.87 /
#             20cm score_r>0.65 & dif0<=0)。
# 特征 f=_g1_arrays(bars) 与横截面池由引擎注入 ctx.ext (见 strategies/g56.py)。
# 出场 = 无追踪纯 7d/-8% (2026-09-17 出场研究定稿)。
# ================================================================
meta:
  name: G56
  market: A                    # A / HK / US / Polymarket → MarketSpec
  version: 1
  enumeration: day             # 逐日候选 → D-1 信号 → D0 开盘入场
  day_flow: g56                # day 流程口径 (g56 特征/池 + 锁仓去重)
  day_start: 68                # 镜像 backtest_stock 的 range(68, n-9)
  day_end: 9                   # 终点 = n-9 (末9日留引擎缓冲, 同研究)
  ext: g56                     # 编排层预计算上下文 (Ctx.ext): G1 特征数组 + 当日横截面池
                               # 见 ide/present.py EXT_PROVIDERS (展示/回测/实盘同源构造)

entry:
  mode: open                   # D0 开盘买入 (next_open)
  price: open
  gap_max: {main: 9.8, gem_star: 19.8}   # gap >= 涨停幅度 → 一字/触板不可买 (lim=0.098/0.198)

exit:
  mode: g56_no_trail           # 无追踪纯 7d/-8% (2026-09-17 出场研究定稿)
  hold_days: 7                 # 最长持有交易日 (含入场日, 出场模拟 d=1..7)
  stop_loss: -8.0              # 硬止损 % (与 initial_stop 同值, 双保险)
                               # 2026-09-23: 由 g56.py 模块常量提升为 yaml 声明
                               # (出场上限 All-Portfolio 统一, 不做板块分档)

params:                        # 与 strategies/g56.py 冻结常量同值 (逐笔等价基线)
  r56: {main: 0.51, gem_star: 0.66}      # ④rhist_chg 门 = 150天池内 Q5
  atr_q5: {main: 5.07, gem_star: 6.42}   # ②ATR14% 下限 = 板块池内 Q5
  main_rmed_min: 0.25          # 主板 regime: 池 rhist_chg 中位数 (raw)
  main_pctb_max: 49.87         # 主板 regime: boll %b 上限
  gem_score_min: 0.65          # 20cm regime: score_r (滚动相对热度)
  # ---- 出场阈值 (2026-09-23 补: 原硬编码于 g56.py 模块常量) ----
  hold_days: 7                 # = g56.HOLD_DAYS
  stop_loss: -8.0              # = g56.STOP_LOSS

# 门表：一行一门。G1 池成员 (trend/atr/big20/finite/warmup) + ④ + ⑤ (分板块 regime)。
# NaN 哨兵：缺值/暖机/池缺失 → 数值门自然失败 (与 _g1_mask 的 isfinite + m[:68]=False 同效)。
gates:
  - {id: g1_warmup, name: 暖机≥68日, role: qualify, needs_d0: 0, enabled: 1,
     expr: "warmup() == 1"}                    # 镜像 _g1_mask 的 m[:68]=False
  - {id: g1_finite, name: 特征有限, role: qualify, needs_d0: 0, enabled: 1,
     expr: "finite() == 1"}                    # 镜像 _g1_mask 的 np.isfinite 过滤
  - {id: g1_trend, name: ①趋势收敛, role: qualify, needs_d0: 0, enabled: 1,
     expr: "abs(feat('rma')) <= 2.5 and feat('rma_chg') > 0"}   # |MA5/MA10-1|<=2.5% & 走强
  - {id: g1_atr, name: ②波动足够, role: qualify, needs_d0: 0, enabled: 1,
     expr: "feat('atr') > pk('atr_q5')"}       # ATR14% > 板块池 Q5
  - {id: g1_big20, name: ③大涨基因, role: qualify, needs_d0: 0, enabled: 1,
     expr: "feat('big20') >= 2"}               # 前20日≥5%大涨日数 >= 2
  - {id: r56, name: ④金叉预测, role: qualify, needs_d0: 0, enabled: 1,
     expr: "feat('rhist_chg') > pk('r56')"}    # MACD柱加速 > 板块 Q5
  - {id: regime_main, name: ⑤板块状态(主板), role: qualify, needs_d0: 0, enabled: 1,
     expr: "board_is_gem() == 1 or (pool_stat('rmed') > pk('main_rmed_min') and feat('pctb') <= pk('main_pctb_max'))"}
  - {id: regime_gem, name: ⑤板块状态(20cm), role: qualify, needs_d0: 0, enabled: 1,
     expr: "board_is_main() == 1 or (pool_stat('score_r') > pk('gem_score_min') and feat('dif0') <= 0)"}

# 信号展示字段 (门通过后求值; 与参考版 trades 逐字段一致)
signal:
  fields:
    rhist_chg: {expr: "feat('rhist_chg')", fmt: r3}
    boll_pctb: {expr: "feat('pctb')", fmt: r2}
    rmed: {expr: "pool_field('rmed')", fmt: r3}
    score_r: {expr: "pool_field('score_r')", fmt: r3}
    # ---- 明日操作分 (2026-09-24 v2, 展示用**独立分**) ----
    # 用 T 日收盘后可知的信息, 估算 **T+1 开盘买 → T+1 收盘卖** 的相对强弱, 0~100,
    # 50 = 明日全市场平均; 偏离 50 的幅度 ∝ 预期超额收益 (加权 1pp ↔ 100 分)。
    # ⚠ 与 `score` 是**两个东西**: score 是策略质量分, 且是 scan.py:254 每日限额截断键;
    #    nd_score 只作展示, **不参与任何门/排序/截断**, 两者禁止混用。
    # 卡面常量/标定/验收见 strategies/g56.py 的 ND_ 注释块 (可复跑 tmp/_nd2_final.py)。
    # 实测 (5 档, 全/seg1/seg2 **三段完全单调**): <=45 偏空 -0.455%/胜41.7% ; >55 偏多
    #   +0.479%/胜48.0%。逐日方向成立率 偏空 64.2% / 偏多 65.9% (均 t>|5.6|)。
    # ⇒ 展示语义: 低分=明天开盘别追 (涨停/一字板最典型); 高分=明天盘中相对强
    #   (上榜未涨停/触板未封最典型)。93% 的票落在中性 (那里没有可靠边际信息)。
    # 数据不足/除权日 ⇒ 求值为 None (不展示)。
    nd_score: {expr: "nd_score()", fmt: r1}
    nd_tag: {expr: "nd_tag()"}
    nd_exp: {expr: "nd_exp()", fmt: r1}
