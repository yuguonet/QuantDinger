# ================================================================
# tail_oversold 尾盘超卖超短 (14:50 尾盘买 → D1 开盘卖) — IDE 门表单文件
# ----------------------------------------------------------------
# 超卖反弹: 当日深跌 + 尾盘适度回落 + 贴近日内低位 + 近5日深度超卖 + 振幅大
# → 次日开盘高概率反弹。入场五条件 (归一化 nf: 创/科板 0.5, 主板 1.0)。
# 盘中通道: 主干折叠 (IntradayFeed + core.replay, 1m 快照注入), entry_at=14:50 (窗口内 14:50 起的触发即可成交)。
# ================================================================
meta:
  name: 尾盘超卖超短
  market: A
  version: 1
  enabled: true                # 策略开关 (§3.5): 宏内一行 = 上下线; 回测/调试不受影响
  enumeration: intraday
  intraday:
    windows: ["14:50", "15:00"]   # 滚动预览窗口 (14:50 起)
    interval_sec: 60
    entry_at: "14:50"             # 14:50 起即可成交 (滚动预览窗口起点)

exit:
  mode: d1_open                   # 次交易日(D1)开盘卖

params:                           # ★ 参数单一事实源 (目标态 §2/§3.1): 判定/出场/生产扫描
                                  #   都读本段 (config.json 的同名 params 已清空)。
  score_min: 8.0                  # V2 评分下限 (归一化后)
  pre5_max: -10.0                 # pre5_gain*nf 上限 (深度超卖)
  amp_min: 8.0                    # amplitude*nf 下限 (弹性)
  tail_lo: -2.8                   # tail_ret*nf 下限
  tail_hi: -0.5                   # tail_ret*nf 上限 (跌太多=还在崩)
  min_hhmm: "14:50"               # 快照时间下限 (滚动预览窗口起点)
  stop_pct: -8.0                  # 止损 % (仅次日有意义, T+1 当日不可卖)
  hold_days: 1                    # 持有1天 (D1开盘卖)

# 门表: qualify = 快照级 / required = 需快照序列(14:20~14:40 均价) + 日线上下文。
# NaN 哨兵: 序列不足/日线不足 → 数值门自然失败 (与参考版早返回同效)。
gates:
  - {id: to_window, name: 预览窗口, role: qualify, needs_d0: 1, enabled: 1,
     expr: "hhmm() >= min_hhmm"}                 # 14:50 之前不出信号
  - {id: to_limit, name: 未封板, role: qualify, needs_d0: 1, enabled: 1,
     expr: "limit_hit() == 0"}                   # 封板买不进
  - {id: to_data, name: 序列+日线可用, role: required, needs_d0: 1, enabled: 1,
     expr: "ok('tail_ret') == 1 and ok('pre5_gain') == 1"}   # tail_ret is None / bars<6 → 拦截
  - {id: to_v2, name: V2五条件, role: required, needs_d0: 1, enabled: 1,
     expr: "feat('score') >= score_min and feat('pre5_gain') * nf() <= pre5_max and feat('amplitude') * nf() >= amp_min and feat('tail_ret') * nf() >= tail_lo and feat('tail_ret') * nf() <= tail_hi"}

# 信号展示字段（宏 = 唯一事实源）：`tail_oversold._gates` 经 `build_signal(ctx, spec)` 按本段
#   产出 Signal.extra ⇒ 改本段即改产物（门禁同 knife_catch）。
signal:
  fields:
    gain: {expr: "feat('day_gain')", fmt: r2}
    amplitude: {expr: "feat('amplitude')", fmt: r2}
    pos_range: {expr: "feat('pos_range')", fmt: r3}
    tail_ret: {expr: "feat('tail_ret')", fmt: r2}
    pre5_gain: {expr: "feat('pre5_gain')", fmt: r2}
    v2_score: {expr: "v2()", fmt: r2}
    pred_score: {expr: "pred_score()", fmt: int}
    pred_exp_ret: {expr: "pred_exp()", fmt: r2}
    tier: {expr: "tier()", fmt: none}
